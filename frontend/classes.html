<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classes & Subjects · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div id="shell"></div>
<div id="page" hidden>
<h1 class="page-title">Classes & Subjects</h1>
<div class="card mb-4"><div class="card-body d-flex justify-content-between align-items-center"><h5 class="mb-0">Classes</h5><button class="btn btn-primary btn-sm" id="add-class"><i class="bi bi-plus-lg"></i> Add class</button></div><div class="table-responsive" id="classes-list"></div></div>
<div class="card"><div class="card-body d-flex justify-content-between align-items-center"><h5 class="mb-0">Subjects</h5><button class="btn btn-primary btn-sm" id="add-subject"><i class="bi bi-plus-lg"></i> Add subject</button></div><div class="table-responsive" id="subjects-list"></div></div>
<div class="modal fade" id="classModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" novalidate><div class="modal-header"><h5 class="modal-title">Class</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Class name</label><input class="form-control" name="className" type="text" required></div><div class="mb-3"><label class="form-label">Semester</label><input class="form-control" name="semester" type="text" required></div><div class="mb-3"><label class="form-label">Academic year (e.g. 2026-27)</label><input class="form-control" name="academicYear" type="text" required></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
<div class="modal fade" id="subjectModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" novalidate><div class="modal-header"><h5 class="modal-title">Subject</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Subject name</label><input class="form-control" name="subjectName" type="text" required></div><div class="mb-3"><label class="form-label">Subject code</label><input class="form-control" name="subjectCode" type="text" required></div><div class="mb-3"><label class="form-label">Class</label><select class="form-select" name="classId" id="sub-class"></select></div><div class="mb-3"><label class="form-label">Assigned teacher</label><select class="form-select" name="teacherUid" id="sub-teacher"></select></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
</div>
<script type="module" src="js/admin.js"></script>
</body></html>
