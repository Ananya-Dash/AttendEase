<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div class="login-wrap">
<section class="login-hero"><div class="d-flex align-items-center gap-2 mb-4 fs-3 fw-bold"><i class="bi bi-mortarboard-fill"></i> AttendEase</div>
<h2 class="fw-bold mb-3">Student Attendance Management</h2><p class="fs-5 opacity-75">Mark, track and analyse attendance in real time. Secure, role-based access for administrators, teachers and students.</p></section>
<section class="login-panel"><div class="card login-card"><h4 class="fw-bold mb-1">Welcome back</h4><p class="text-muted mb-4">Sign in to your portal</p>
<div id="login-alert"></div>
<form id="login-form" novalidate><div class="mb-3"><label class="form-label">Email</label><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span><input type="email" id="email" class="form-control" autocomplete="username" required></div></div>
<div class="mb-4"><label class="form-label">Password</label><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-lock"></i></span><input type="password" id="password" class="form-control" autocomplete="current-password" required></div></div>
<button class="btn btn-primary w-100 py-2" id="login-btn" type="submit">Sign in</button></form>
<p class="text-muted small mt-4 mb-0">Accounts are created by your administrator.</p></div></section></div>
<script type="module" src="js/login.js"></script></body></html>
