<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Attendance · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div id="shell"></div>
<div id="page" hidden>
<h1 class="page-title">Mark Attendance</h1>
<div class="card p-3 mb-3"><div class="row g-3 align-items-end">
<div class="col-md-3"><div class="mb-3"><label class="form-label">Class</label><select class="form-select" name="c" id="f-class"></select></div></div><div class="col-md-3"><div class="mb-3"><label class="form-label">Subject</label><select class="form-select" name="s" id="f-subject"></select></div></div>
<div class="col-md-3"><div class="mb-3"><label class="form-label">Date</label><input type="date" id="f-date" class="form-control"></div></div>
<div class="col-md-3"><div class="mb-3"><button class="btn btn-primary w-100" id="load-btn"><i class="bi bi-people"></i> Load students</button></div></div></div></div>
<div id="roster-card" class="card" hidden><div class="card-body d-flex flex-wrap gap-2 align-items-center">
<div class="input-group" style="max-width:280px"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Search students"></div>
<span class="badge text-bg-info" id="mode-info"></span><div class="form-check form-switch ms-2"><input class="form-check-input" type="checkbox" id="cancelled"><label class="form-check-label" for="cancelled">Class cancelled</label></div>
<div class="ms-auto d-flex gap-2"><button class="btn btn-outline-success btn-sm" id="all-present">All present</button><button class="btn btn-outline-danger btn-sm" id="all-absent">All absent</button></div></div>
<div class="table-responsive" id="roster"></div><div class="card-body text-end"><button class="btn btn-primary" id="save-btn"><i class="bi bi-save"></i> Save attendance</button></div></div>
</div>
<script type="module" src="js/attendance.js"></script>
</body></html>
