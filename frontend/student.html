<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div id="shell"></div>
<div id="page" hidden>
<h1 class="page-title">My Dashboard</h1>
<div id="warning"></div>
<div class="card p-3 mb-3"><div class="d-flex align-items-center gap-3"><span class="avatar" style="width:52px;height:52px" id="p-avatar"></span><div><div class="fw-semibold" id="p-name"></div><div class="text-muted small" id="p-meta"></div></div></div></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="card p-3"><div class="text-muted small">Overall attendance</div><div class="value fs-2 fw-bold" id="st-pct">–</div></div></div><div class="col-6 col-md-4"><div class="card stat-card p-3"><div class="d-flex align-items-center gap-3"><div class="icon"><i class="bi bi-calendar3"></i></div><div><div class="text-muted small">Classes conducted</div><div class="value" id="st-conducted">–</div></div></div></div></div><div class="col-6 col-md-4"><div class="card stat-card p-3"><div class="d-flex align-items-center gap-3"><div class="icon"><i class="bi bi-check-circle"></i></div><div><div class="text-muted small">Classes attended</div><div class="value" id="st-attended">–</div></div></div></div></div></div>
<div class="row g-3"><div class="col-lg-7"><div class="card"><div class="card-body pb-0"><h6>Subject-wise attendance</h6></div><div class="table-responsive" id="subjects"></div></div></div>
<div class="col-lg-5"><div class="card p-3"><h6>Attendance by subject</h6><div class="chart-box"><canvas id="chartSubjects"></canvas></div></div></div></div>
</div>
<script type="module" src="js/student.js"></script>
</body></html>
