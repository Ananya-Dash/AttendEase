<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Records · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div id="shell"></div>
<div id="page" hidden>
<h1 class="page-title">Attendance Records</h1>
<div class="card p-3 mb-3"><div class="row g-3 align-items-end">
<div class="col-md-3"><div class="mb-3"><label class="form-label">Class</label><select class="form-select" name="c" id="f-class"></select></div></div><div class="col-md-3"><div class="mb-3"><label class="form-label">Subject</label><select class="form-select" name="s" id="f-subject"></select></div></div>
<div class="col-md-3"><div class="mb-3"><label class="form-label">Date</label><input type="date" id="f-date" class="form-control"></div></div>
<div class="col-md-3 mb-3 d-flex gap-2"><button class="btn btn-primary flex-grow-1" id="apply-btn">Apply</button><button class="btn btn-light" id="clear-btn">Clear</button></div></div></div>
<div class="card mb-4"><div class="card-body pb-0"><h6>Sessions</h6></div><div class="table-responsive" id="sessions"></div></div>
<div class="card" id="summary-card" hidden><div class="card-body d-flex flex-wrap gap-2 align-items-center"><h6 class="mb-0 me-auto" id="summary-title">Student attendance</h6>
<div class="input-group" style="max-width:280px"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Name or student ID"></div></div>
<div class="px-3"><div class="chart-box" style="height:220px"><canvas id="chartSummary"></canvas></div></div><div class="table-responsive" id="summary"></div></div>
<div class="modal fade" id="sessionModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="sessionTitle">Session</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body p-0" id="sessionBody"></div></div></div></div>
</div>
<script type="module" src="js/attendance.js"></script>
</body></html>
