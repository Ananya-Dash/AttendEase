<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Students · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div id="shell"></div>
<div id="page" hidden>
<h1 class="page-title">Manage Students</h1>
<div class="d-flex flex-wrap gap-2 mb-3"><div class="input-group" style="max-width:340px"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Search name, ID or email"></div>
<select id="status" class="form-select" style="max-width:160px"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
<button class="btn btn-primary ms-auto" id="add-btn"><i class="bi bi-plus-lg"></i> Add student</button></div>
<div class="card"><div class="table-responsive" id="list"></div></div>
<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" novalidate><div class="modal-header"><h5 class="modal-title">Add student</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="fullName" type="text" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div><div class="mb-3"><label class="form-label">Initial password (min 8 characters)</label><input class="form-control" name="password" type="password" required></div><div class="mb-3"><label class="form-label">Student ID</label><input class="form-control" name="studentId" type="text" required></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div><div class="modal fade" id="enrollModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><form class="modal-content" novalidate><div class="modal-header"><h5 class="modal-title">Enroll student</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label class="form-label">Class</label><select class="form-select" name="classId" id="enroll-class"></select></div><label class="form-label">Subjects</label><div id="enroll-subjects" class="border rounded p-2"></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div>
</div>
<script type="module" src="js/admin.js"></script>
</body></html>
