<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Attendance · AttendEase</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body><div id="shell"></div>
<div id="page" hidden>
<h1 class="page-title">My Attendance</h1>
<div class="row g-3 mb-3"><div class="col-lg-8"><div class="card p-3"><div class="row g-3 align-items-end"><div class="col-md-5"><div class="mb-3"><label class="form-label">Filter by subject</label><select class="form-select" name="s" id="f-subject"></select></div></div><div class="col-md-7"><div class="mb-3" id="summary-line"></div></div></div></div></div></div>
<div class="row g-3"><div class="col-lg-4"><div class="card p-3"><h6>Present vs absent</h6><div class="chart-box"><canvas id="chartStatus"></canvas></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-body pb-0"><h6>Attendance history</h6></div><div class="table-responsive" id="history"></div></div></div></div>
</div>
<script type="module" src="js/student.js"></script>
</body></html>
